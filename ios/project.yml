name: Enigo
options:
  bundleIdPrefix: com.enigo
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Enigo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Enigo
    resources:
      - path: Enigo/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Enigo/Info.plist
      properties:
        # Without these two, xcodegen bakes a literal CFBundleVersion of "1"
        # into Info.plist and the CURRENT_PROJECT_VERSION/MARKETING_VERSION
        # build settings below are silently ignored — every archive ships as
        # build 1 and App Store Connect rejects it as a duplicate.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Enigo only uses HTTPS to talk to Supabase, Twilio and GIPHY — that
        # is exempt encryption, and declaring it here stops App Store Connect
        # asking on every single upload and holding the build in processing
        # until someone answers.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Fraunces.ttf
          - Inter.ttf
        NSLocationWhenInUseUsageDescription: "Enigo ranks matches by distance and reveals a rough area once you and your match have both shown up. Your exact location is never shared."
        NSPhotoLibraryUsageDescription: "Choose a photo to have ready for graduation — it stays hidden until then."
        NSUserNotificationsUsageDescription: "Enigo lets you know about new messages and unlock moments only."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enigo.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "16"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "J4D83S2UGB"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Enigo/Enigo.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        GCC_WARN_ABOUT_RETURN_TYPE: YES
        GCC_WARN_UNUSED_VARIABLE: YES
        GCC_WARN_UNUSED_FUNCTION: YES
    scheme:
      # Lets the paywall's StoreKit 2 calls resolve products locally without
      # an App Store Connect account — see Enigo/Products.storekit.
      storeKitConfiguration: Enigo/Products.storekit
